databases:
  - name: mahawork-db
    databaseName: mahawork
    user: mahawork
    plan: basic-256mb
services:
  - type: web
    name: mahawork-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mahawork-db
          property: connectionString
      - key: SUPER_ADMIN_PHONE
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
