{% extends 'base.html' %}{% block content %}<div class="form"><h1>कामगार नोंदणी</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>पूर्ण नाव<input name="full_name" required></label><label>मोबाईल<input name="phone" maxlength="10" pattern="[0-9]{10}" required></label><label>पासवर्ड<input name="password" type="password" minlength="8" required></label><label>जिल्हा<select name="district_code" id="district" required><option value="">निवडा</option>{% for d in districts %}<option value="{{d.code}}">{{d.name_mr}} / {{d.name_en}}</option>{% endfor %}</select></label><label>तालुका<select name="taluka_code" id="taluka" required></select></label><label>गाव<select name="village_code" id="village" required></select></label><label>कामगार प्रकार<select name="worker_type" id="worker_type"><option>Skilled</option><option>Unskilled</option></select></label><label>कौशल्य<select name="skill" id="skill"></select></label><label>अनुभव वर्षे<input type="number" name="experience_years" min="0" value="0"></label><label>अपेक्षित रोजंदारी ₹<input type="number" name="expected_daily_wage" min="0"></label><label>उपलब्धता<select name="availability"><option>Available</option><option>Not Available</option></select></label><label>अतिरिक्त माहिती<textarea name="notes"></textarea></label><button class="btn">नोंदणी पूर्ण करा</button></form></div><script>window.MAHA_SKILLED={{skilled|tojson}};window.MAHA_UNSKILLED={{unskilled|tojson}};</script><script src="{{url_for('static',filename='locations.js')}}"></script>{% endblock %}
