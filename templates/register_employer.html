{% extends 'base.html' %}{% block content %}<section class="form-panel narrow"><h1>Builder / Contractor Registration</h1><p>नोंदणीनंतर Login करून बांधकाम काम पोस्ट करता येईल.</p><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>संस्था / व्यक्तीचे नाव *<input name="full_name" required></label><label>मोबाईल नंबर *<input name="phone" pattern="[0-9]{10}" maxlength="10" required></label><label>भूमिका *<select name="role"><option value="">निवडा</option><option value="Builder">Builder / Developer</option><option value="Contractor">Contractor</option></select></label><label>पासवर्ड *<input type="password" name="password" minlength="8" required></label><button class="btn">नोंदणी करा</button></form></section>{% endblock %}
