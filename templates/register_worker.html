{% extends 'base.html' %}{% block content %}<section class="form-panel"><h1>कामगार नोंदणी</h1><p>मोबाईल नंबर हा Login ID असेल.</p><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>पूर्ण नाव *<input name="full_name" required></label><label>मोबाईल नंबर *<input name="phone" pattern="[0-9]{10}" maxlength="10" required></label><label>पासवर्ड *<input type="password" name="password" minlength="8" required></label><label>जिल्हा *<select name="district_code" id="district" required><option value="">जिल्हा निवडा</option>{% for d in districts %}<option value="{{d.code}}">{{d.name_mr}} / {{d.name_en}}</option>{% endfor %}</select></label><label>तालुका *<select name="taluka_code" id="taluka" required><option>जिल्हा निवडा</option></select></label><label>गाव *<select name="village_code" id="village" required><option>तालुका निवडा</option></select></label><label>कामगार प्रकार *<select name="worker_type" id="worker_type"><option value="">निवडा</option><option>Skilled</option><option>Unskilled</option></select></label><label>कौशल्य *<select name="skill" id="skill"><option>प्रकार निवडा</option></select></label><label>अनुभव वर्षे<input type="number" name="experience_years" min="0" max="60" value="0"></label><label>अपेक्षित रोजंदारी ₹<input type="number" name="expected_daily_wage" min="0"></label><label>उपलब्धता<select name="availability"><option>Available</option><option>Not Available</option></select></label><label class="wide">अतिरिक्त माहिती<textarea name="notes" rows="3"></textarea></label><label class="wide consent"><input type="checkbox" required> रोजगार जुळवणीसाठी माझी माहिती वापरण्यास संमती देतो/देते.</label><button class="btn">नोंदणी पूर्ण करा</button></form></section><script>window.MAHA_SKILLED={{skilled|tojson}};window.MAHA_UNSKILLED={{unskilled|tojson}};</script><script src="{{url_for('static',filename='locations.js')}}"></script>{% endblock %}
