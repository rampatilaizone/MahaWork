{% extends 'base.html' %}{% block content %}<h1>Super Admin Dashboard</h1><div class="stats">{% for k,v in counts.items() %}<div><small>{{k}}</small><b>{{v}}</b></div>{% endfor %}</div><div class="panel"><h2>Recent Users</h2><table><tr><th>नाव</th><th>मोबाईल</th><th>भूमिका</th><th>स्थिती</th></tr>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.phone}}</td><td>{{u.role}}</td><td>{{'Active' if u.active else 'Inactive'}}</td></tr>{% endfor %}</table></div>{% endblock %}
