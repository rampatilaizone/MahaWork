{% extends 'base.html' %}{% block content %}<h1>कामासाठी आलेले अर्ज</h1><div class="panel"><table><tr><th>काम ID</th><th>कामगार ID</th><th>संदेश</th><th>स्थिती</th><th>बदला</th></tr>{% for a in rows %}<tr><td>{{a.job_id}}</td><td>{{a.worker_id}}</td><td>{{a.message}}</td><td>{{a.status}}</td><td><form method="post" action="/applications/{{a.id}}/status"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><select name="status"><option>Applied</option><option>Shortlisted</option><option>Selected</option><option>Rejected</option></select><button class="btn">Save</button></form></td></tr>{% else %}<tr><td colspan="5">अर्ज नाहीत.</td></tr>{% endfor %}</table></div>{% endblock %}
