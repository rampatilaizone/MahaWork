{% extends 'base.html' %}{% block content %}<div class="form narrow"><h1>Builder / Contractor Registration</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>संस्था / नाव<input name="full_name" required></label><label>मोबाईल<input name="phone" maxlength="10" pattern="[0-9]{10}" required></label><label>भूमिका<select name="role"><option>Builder</option><option>Contractor</option></select></label><label>पासवर्ड<input name="password" type="password" minlength="8" required></label><button class="btn">नोंदणी</button></form></div>{% endblock %}
