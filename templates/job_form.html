{% extends 'base.html' %}{% block content %}<div class="form"><h1>नवीन बांधकाम काम पोस्ट करा</h1><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>कामाचे नाव<input name="title" required></label><label>कामाचा प्रकार<select name="category">{% for c in categories %}<option>{{c}}</option>{% endfor %}</select></label><label>कामगार प्रकार<select name="worker_type" id="worker_type"><option>Skilled</option><option>Unskilled</option></select></label><label>कौशल्य<select name="skill" id="skill"></select></label><label>कामगार संख्या<input name="workers_needed" type="number" min="1" value="1"></label><label>रोजंदारी ₹<input name="daily_wage" type="number" min="0"></label><label>जिल्हा<select name="district_code" id="district" required><option value="">निवडा</option>{% for d in districts %}<option value="{{d.code}}">{{d.name_mr}} / {{d.name_en}}</option>{% endfor %}</select></label><label>तालुका<select name="taluka_code" id="taluka" required></select></label><label>गाव<select name="village_code" id="village" required></select></label><label>काम सुरू तारीख<input type="date" name="start_date"></label><label>संपर्क मोबाईल<input name="contact_phone" maxlength="10" required></label><label>तपशील<textarea name="description"></textarea></label><button class="btn">काम प्रकाशित करा</button></form></div><script>window.MAHA_SKILLED={{skilled|tojson}};window.MAHA_UNSKILLED={{unskilled|tojson}};</script><script src="{{url_for('static',filename='locations.js')}}"></script>{% endblock %}
